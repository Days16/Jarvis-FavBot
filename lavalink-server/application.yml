server:
  port: ${PORT:2333}
  address: 0.0.0.0

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    oauth:
      enabled: true
      # Tras autorizar por primera vez, añade el token como variable de entorno en Render
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
    clients:
      - MUSIC
      - WEB
      - ANDROID
      - IOS
      - ANDROID_VR

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "${LAVALINK_PASS:M1C0ntr4s3n4}"
    sources:
      youtube: false       # se usa el plugin de arriba
      soundcloud: true
      bandcamp: true
      twitch: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      timescale: true
      tremolo: true
      vibrato: true
      rotation: true
      distortion: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

logging:
  level:
    root: INFO
    lavalink: INFO
